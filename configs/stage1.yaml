world: configs/world.yaml
optimizer: adamw
learning_rate: 0.0001
weight_decay: 0.01
betas: [0.9, 0.95]
gradient_clip_norm: 1.0
precision: bfloat16
effective_batch_size: 128
micro_batch_size: 64
optimizer_updates: 20000
warmup_fraction: 0.05
endpoint_time_probability: 0.2
max_null_text_fraction: 0.2
validity_loss_weight: 0.1
fit_regularization: 0.001
fit_min_valid_steps: 10
fit_max_condition: 100000.0
reliability_threshold: 0.5
dynamic_threshold: 0.05
mixture:
  human_nominal: 0.5
  human_corrective: 0.25
  robot_nominal_video: 0.25
num_workers: 8
log_every: 50
eval_every: 1000
eval_batches: 20
checkpoint_every: 1000
seed: 0
